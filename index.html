<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Tasks</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="todo-app">
      <header class="app-header">
        <p class="eyebrow">MY DAY</p>
        <h1>Things to do</h1>
        <p id="today" class="date"></p>
      </header>

      <form id="todo-form" class="todo-form">
        <label class="sr-only" for="todo-input">New task</label>
        <input id="todo-input" type="text" placeholder="What needs to be done?" maxlength="120" autocomplete="off" required />
        <button type="submit" class="add-button">Add</button>
      </form>

      <section class="task-panel" aria-labelledby="task-heading">
        <div class="toolbar">
          <h2 id="task-heading">Tasks</h2>
          <div class="filters" aria-label="Filter tasks">
            <button type="button" class="filter active" data-filter="all">All</button>
            <button type="button" class="filter" data-filter="active">Active</button>
            <button type="button" class="filter" data-filter="completed">Done</button>
          </div>
        </div>
        <ul id="todo-list" class="todo-list"></ul>
        <div id="empty-state" class="empty-state">
          <span aria-hidden="true">✓</span>
          <p>No tasks here</p>
          <small>Add something you want to accomplish.</small>
        </div>
        <footer class="list-footer">
          <span id="items-left">0 tasks left</span>
          <button id="clear-completed" type="button">Clear completed</button>
        </footer>
      </section>
    </main>
    <script src="renderer.js"></script>
  </body>
</html>
